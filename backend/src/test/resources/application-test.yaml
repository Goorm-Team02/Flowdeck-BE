spring:
  datasource:
    url: jdbc:h2:mem:flowdeck-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jpa:
    auditing:
      enabled: true
  security:
    jwt:
      secret: flowdeck-test-jwt-secret-key-change-me-now-123456
