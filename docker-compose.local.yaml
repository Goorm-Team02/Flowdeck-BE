name: flowdeck-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: flowdeck-local-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowdeck}
      POSTGRES_USER: ${POSTGRES_USER:-flowdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowdeck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flowdeck-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flowdeck-local-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - flowdeck-local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: flowdeck-backend-local:${BACKEND_IMAGE_TAG:-latest}
    container_name: flowdeck-local-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowdeck}
      DB_USERNAME: ${POSTGRES_USER:-flowdeck}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-flowdeck}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET:-flowdeck-local-jwt-secret-key-change-me-now-123456}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-1800}
      JWT_REFRESH_TOKEN_EXPIRATION_SECONDS: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:-1209600}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-*}
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-Authorization}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-3600}

      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  flowdeck-local-postgres-data:
  flowdeck-local-redis-data:
