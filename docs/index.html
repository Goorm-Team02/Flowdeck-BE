<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowDeck API Docs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        background: #f4f7fb;
        color: #10233f;
        font-family:
          "SUIT Variable",
          "Pretendard Variable",
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .page-header {
        padding: 28px 24px 20px;
        background:
          radial-gradient(circle at top left, rgba(76, 132, 255, 0.18), transparent 30%),
          linear-gradient(135deg, #ffffff 0%, #edf4ff 100%);
        border-bottom: 1px solid rgba(16, 35, 63, 0.08);
      }

      .page-header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .page-header p {
        margin: 0;
        font-size: 14px;
        color: #48627f;
      }

      #swagger-ui {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <h1>FlowDeck API Docs</h1>
      <p>develop 기준 정적 OpenAPI 문서입니다. 실제 API 호출은 비활성화되어 있습니다.</p>
    </header>
    <main id="swagger-ui"></main>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "BaseLayout",
        supportedSubmitMethods: [],
        displayRequestDuration: true,
      });
    </script>
  </body>
</html>
