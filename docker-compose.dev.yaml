services:
  postgres:
    image: postgres:17-alpine
    container_name: flowdeck-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowdeck}
      POSTGRES_USER: ${POSTGRES_USER:-flowdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowdeck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flowdeck-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flowdeck} -d ${POSTGRES_DB:-flowdeck}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowdeck-postgres-data:
