name: Deploy AWS Backend

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run backend quality gate
        run: ./gradlew check

  deploy-dev:
    name: Deploy backend-dev
    needs: verify
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: backend-dev

    steps:
      - name: Deploy develop to backend-dev
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ vars.DEV_APP_DIR }}
          DEPLOY_BRANCH: develop
          ENV_FILE: ${{ vars.DEV_ENV_FILE }}
          COMPOSE_FILE: docker-compose.dev.yaml
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT || 22 }}
          envs: APP_DIR,DEPLOY_BRANCH,ENV_FILE,COMPOSE_FILE
          script_stop: true
          script: |
            set -euo pipefail

            cd "$APP_DIR"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --build --remove-orphans
            docker image prune -f

  deploy-prod:
    name: Deploy backend-prod
    needs: verify
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: backend-prod

    steps:
      - name: Deploy main to backend-prod
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR }}
          DEPLOY_BRANCH: main
          ENV_FILE: ${{ vars.PROD_ENV_FILE }}
          COMPOSE_FILE: docker-compose.prod.yaml
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: APP_DIR,DEPLOY_BRANCH,ENV_FILE,COMPOSE_FILE
          script_stop: true
          script: |
            set -euo pipefail

            cd "$APP_DIR"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --build --remove-orphans
            docker image prune -f
