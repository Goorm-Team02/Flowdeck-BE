name: Deploy AWS Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run backend quality gate
        run: ./gradlew check

  deploy-prod:
    name: Deploy backend-prod
    needs: verify
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: backend-prod

    steps:
      - name: Validate backend-prod deployment configuration
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
          PROD_ENV_FILE: ${{ vars.PROD_ENV_FILE }}
        run: |
          missing=()

          [[ -n "$PROD_SSH_HOST" ]] || missing+=(PROD_SSH_HOST)
          [[ -n "$PROD_SSH_USER" ]] || missing+=(PROD_SSH_USER)
          [[ -n "$PROD_SSH_PRIVATE_KEY" ]] || missing+=(PROD_SSH_PRIVATE_KEY)
          [[ -n "$PROD_APP_DIR" ]] || missing+=(PROD_APP_DIR)
          [[ -n "$PROD_ENV_FILE" ]] || missing+=(PROD_ENV_FILE)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing backend-prod deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Deploy main to backend-prod
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR }}
          DEPLOY_BRANCH: main
          ENV_FILE: ${{ vars.PROD_ENV_FILE }}
          COMPOSE_FILE: docker-compose.prod.yaml
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: APP_DIR,DEPLOY_BRANCH,ENV_FILE,COMPOSE_FILE
          script: |
            set -euo pipefail

            cd "$APP_DIR"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --build --remove-orphans
            docker image prune -f
