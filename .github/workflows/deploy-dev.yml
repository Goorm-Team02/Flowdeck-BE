name: Backend Dev CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'develop')
      }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEV_SERVER_HOST: ${{ vars.DEV_SERVER_HOST }}
      DEV_SERVER_PORT: ${{ vars.DEV_SERVER_PORT || '22' }}
      DEV_SERVER_USER: ${{ vars.DEV_SERVER_USER }}
      DEV_APP_DIR: ${{ vars.DEV_APP_DIR || '/opt/flowdeck/backend-dev' }}
      DEV_SERVER_SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
      DEV_SERVER_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
      DEV_GHCR_USERNAME: ${{ secrets.DEV_GHCR_USERNAME }}
      DEV_GHCR_TOKEN: ${{ secrets.DEV_GHCR_TOKEN }}

    steps:
      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            deploy_sha="${{ github.event.workflow_run.head_sha }}"
            deploy_branch="${{ github.event.workflow_run.head_branch }}"
          else
            deploy_sha="$GITHUB_SHA"
            deploy_branch="$GITHUB_REF_NAME"
          fi

          if [[ "$deploy_branch" != "develop" ]]; then
            echo "::error::This workflow only deploys the develop branch."
            exit 1
          fi

          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/flowdeck-backend-dev"

          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(DEV_SERVER_HOST DEV_SERVER_PORT DEV_SERVER_USER DEV_APP_DIR)
          required_secrets=(
            DEV_SERVER_SSH_KEY
            DEV_SERVER_KNOWN_HOSTS
            DEV_GHCR_USERNAME
            DEV_GHCR_TOKEN
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository/environment variable: $name"
              exit 1
            fi
          done

          for name in "${required_secrets[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository/environment secret: $name"
              exit 1
            fi
          done

      - name: Checkout target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.deploy_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for Gradle wrapper
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Run backend quality gate
        working-directory: backend
        run: ./gradlew check

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push dev image
        shell: bash
        run: |
          set -euo pipefail

          image="${{ steps.meta.outputs.image }}"
          sha_tag="${{ steps.meta.outputs.deploy_sha }}"
          source_repo="${{ steps.meta.outputs.source }}"

          docker build \
            --build-arg SOURCE_REPOSITORY="$source_repo" \
            --build-arg VCS_REF="$sha_tag" \
            -f backend/Dockerfile \
            -t "$image:develop" \
            -t "$image:$sha_tag" \
            backend

          docker push "$image:develop"
          docker push "$image:$sha_tag"

      - name: Prepare SSH credentials
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$DEV_SERVER_SSH_KEY" > ~/.ssh/dev_server_key
          printf '%s\n' "$DEV_SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dev_server_key
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deployment compose file
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/dev_server_key -p "$DEV_SERVER_PORT" "$DEV_SERVER_USER@$DEV_SERVER_HOST" \
            "mkdir -p '$DEV_APP_DIR'"

          scp -i ~/.ssh/dev_server_key -P "$DEV_SERVER_PORT" \
            backend/docker-compose.dev.yaml \
            "$DEV_SERVER_USER@$DEV_SERVER_HOST:$DEV_APP_DIR/docker-compose.yaml"

      - name: Deploy to dev server
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/dev_server_key -p "$DEV_SERVER_PORT" "$DEV_SERVER_USER@$DEV_SERVER_HOST" <<EOF
          set -euo pipefail
          cd "$DEV_APP_DIR"

          if [[ ! -f .env ]]; then
            echo "Missing $DEV_APP_DIR/.env on the dev server." >&2
            exit 1
          fi

          printf '%s' "$DEV_GHCR_TOKEN" | docker login ghcr.io -u "$DEV_GHCR_USERNAME" --password-stdin

          BACKEND_IMAGE="${{ steps.meta.outputs.image }}:develop" docker compose -f docker-compose.yaml pull
          BACKEND_IMAGE="${{ steps.meta.outputs.image }}:develop" docker compose -f docker-compose.yaml up -d --remove-orphans

          docker image prune -f
          EOF
