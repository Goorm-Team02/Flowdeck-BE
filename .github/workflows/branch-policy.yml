name: Branch Policy Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-branch-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch naming and target
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          branch_pattern='^(feature|fix|refactor|docs)/[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "develop" ]]; then
              echo "::error::Only develop can open a pull request into main."
              exit 1
            fi
            exit 0
          fi

          if ! [[ "$HEAD_REF" =~ $branch_pattern ]]; then
            echo "::error::Invalid branch name: $HEAD_REF"
            echo "::error::Use feature/*, fix/*, refactor/*, or docs/* with lowercase kebab-case names."
            exit 1
          fi

          if [[ "$BASE_REF" == "develop" ]]; then
            exit 0
          fi

          if ! [[ "$BASE_REF" =~ $branch_pattern ]]; then
            echo "::error::Pull requests must target develop or a parent work branch. Only release PRs from develop may target main."
            exit 1
          fi

          head_type="${HEAD_REF%%/*}"
          base_type="${BASE_REF%%/*}"
          head_name="${HEAD_REF#*/}"
          base_name="${BASE_REF#*/}"

          if [[ "$head_type" != "$base_type" ]]; then
            echo "::error::Stacked pull requests must use the same branch type for source and target."
            exit 1
          fi

          if [[ "$head_name" != "$base_name"-* ]]; then
            echo "::error::Stacked pull requests must target a parent branch whose name is a prefix of the source branch."
            echo "::error::Example: feature/project-file-search -> feature/project-file"
            exit 1
          fi
